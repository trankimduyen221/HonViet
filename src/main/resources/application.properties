spring.application.name=HonViet
# 1. Cấu hình cổng chạy ứng dụng Backend (Nhận cổng động từ Render)
server.port=${PORT:8080}

# 2. Cấu hình kết nối Database (TiDB Cloud / Aiven)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/honviet_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}

# 3. Cấu hình HikariCP Keep-Alive
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=3000

# 4. Cấu hình JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 5. CẤU HÌNH DUNG LƯỢNG FILE UPLOAD
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# 6. CẤU HÌNH MAIL GỬI OTP (Bổ sung Timeout để tránh treo xoay nút loading)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:email-cua-ban@gmail.com}
spring.mail.password=${MAIL_PASSWORD:16-ky-tu-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# --- BỔ SUNG THÊM MẤY DÒNG NÀY ---
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000